[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvgl-visuino-setup-manager"
version = "1.0.1"
description = "A guarded Windows setup manager for Visuino Pro library profiles."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Finn Andre Hotvedt"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Pillow>=10.2,<12",
    "Send2Trash>=2.1,<3",
]

[project.scripts]
lvgl-visuino-setup-manager = "lvgl_visuino_setup_manager.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
